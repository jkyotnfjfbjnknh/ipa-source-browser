name: IPASourceBrowser
options:
  bundleIdPrefix: com.jkyotnfjfbjnknh
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.9"
targets:
  IPASourceBrowser:
    type: application
    platform: iOS
    sources:
      - path: Sources/IPASourceBrowser
    info:
      path: Sources/IPASourceBrowser/Info.plist
      properties:
        CFBundleDisplayName: IPA 源商店
        CFBundleName: IPASourceBrowser
        # XcodeGen's generated Info.plist hardcodes 1.0 / 1 unless these are
        # bound to the build settings explicitly; the plist processor expands
        # the variables at build time.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        MARKETING_VERSION: "1.0.3"
        CURRENT_PROJECT_VERSION: "4"
        PRODUCT_BUNDLE_IDENTIFIER: com.jkyotnfjfbjnknh.ipasourcebrowser
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true
schemes:
  IPASourceBrowser:
    build:
      targets:
        IPASourceBrowser: all
    run:
      config: Debug
    archive:
      config: Release
